[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reel-pipeline"
version = "0.1.0"
description = "Daily footage -> approved Instagram Reel, with a human approval gate."
requires-python = ">=3.11"
dependencies = ["PyYAML>=6", "requests>=2.31", "Pillow>=10", "pysubs2>=1.7", "numpy>=1.26"]

[project.optional-dependencies]
# Heavy local models. Installed on the machine that runs the pipeline,
# not needed for the test suite (tests inject fake backends).
ml = ["faster-whisper>=1.1", "scenedetect[opencv]>=0.6.4", "opencv-python-headless>=4.9"]
dev = ["pytest>=8"]

[project.scripts]
reel = "reel.cli:main"

[tool.setuptools.packages.find]
include = ["reel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
